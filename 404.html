<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found — Ceasar Enterprises</title>
    <link rel="canonical" href="https://ceasar-enterprises.github.io/404.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <style>
        .nf { min-height: 100svh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; position: relative; }
        .nf::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 50% 40% at 50% 0%, rgba(232,184,75,0.12), transparent 60%); pointer-events: none; }
        .nf-inner { position: relative; z-index: 2; }
        .nf-code { font-family: var(--font-display); font-size: clamp(90px, 18vw, 180px); font-weight: 700; line-height: 1; color: var(--gold); }
        .nf h1 { margin: 12px 0 14px; }
        .nf p { color: var(--muted); margin-bottom: 34px; }
    </style>
</head>
<body>
    <div class="nf">
        <div class="nf-inner">
            <div class="nf-code reveal in">404</div>
            <h1 class="reveal in d1">This page left the grid.</h1>
            <p class="reveal in d2">We couldn't find what you're looking for. (Quite fitting for an offline-first company — but let's get you back online.)</p>
            <a class="btn btn-gold" href="index.html">← Back to home</a>
        </div>
    </div>
</body>
</html>
